name: Build OptiCraft v147 NRO

on:
  workflow_dispatch:
  push:
    paths:
      - "OptiCraft_Switch_v147_Original_Main_Menu.zip"
      - "Makefile.switch"
      - "switch_nro/**"
      - ".github/workflows/build-nro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro toolchain and libnx
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -f "$DEVKITPRO/libnx/lib/libnx.a"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          test -x "$DEVKITPRO/tools/bin/nacptool"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version

      - name: Extract v147 source archive
        run: |
          test -s OptiCraft_Switch_v147_Original_Main_Menu.zip
          mkdir -p source
          unzip -q OptiCraft_Switch_v147_Original_Main_Menu.zip -d source
          test -f source/opticraft_v141_work/src/switch_diagnostic_main.cpp
          test -f source/opticraft_v141_work/src/framebuffer_blit.cpp
          test -f source/opticraft_v141_work/include/switch_backend.hpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/opticraft_v141_work/src/switch_diagnostic_main.cpp')
          s = p.read_text()
          needle = '    hidInitializeNpad();'
          replacement = '''    hidInitializeNpad();
              const HidNpadIdType supported_ids[] = {
                  HidNpadIdType_Handheld,
                  HidNpadIdType_No1
              };
              hidSetSupportedNpadIdType(supported_ids, 2);
              hidSetSupportedNpadStyleSet(
                  HidNpadStyleTag_NpadHandheld |
                  HidNpadStyleTag_NpadFullKey |
                  HidNpadStyleTag_NpadJoyDual
              );'''
          assert s.count(needle) == 1
          s = s.replace(needle, replacement, 1)
          old = '''    const struct { u64 mask; int x; int y; } indicators[] = {
        {HidNpadButton_A, 640, 260}, {HidNpadButton_B, 700, 320},
        {HidNpadButton_X, 580, 320}, {HidNpadButton_Y, 640, 380},
        {HidNpadButton_L, 500, 120}, {HidNpadButton_R, 780, 120},
        {HidNpadButton_Plus, 640, 520}, {HidNpadButton_Minus, 640, 580}
    };'''
          new = '''    // Nintendo Switch-native layout: A right, B bottom, X top, Y left.
    // Every indicator is driven by the matching libnx physical button bit.
    const struct { u64 mask; int x; int y; } indicators[] = {
        {HidNpadButton_Y, 565, 335}, {HidNpadButton_X, 640, 270},
        {HidNpadButton_A, 715, 335}, {HidNpadButton_B, 640, 400},
        {HidNpadButton_Up, 260, 260}, {HidNpadButton_Down, 260, 460},
        {HidNpadButton_Left, 160, 360}, {HidNpadButton_Right, 360, 360},
        {HidNpadButton_L, 470, 120}, {HidNpadButton_R, 810, 120},
        {HidNpadButton_ZL, 390, 80}, {HidNpadButton_ZR, 890, 80},
        {HidNpadButton_StickL, 260, 570}, {HidNpadButton_StickR, 1020, 570},
        {HidNpadButton_Minus, 565, 570}, {HidNpadButton_Plus, 715, 570}
    };'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'hidSetSupportedNpadStyleSet' source/opticraft_v141_work/src/switch_diagnostic_main.cpp

      - name: Attach the Switch NRO target
        run: |
          cp Makefile.switch source/opticraft_v141_work/Makefile
          cp -R switch_nro source/opticraft_v141_work/switch_nro
          test -f source/opticraft_v141_work/Makefile
          test -f source/opticraft_v141_work/switch_nro/main.cpp

      - name: Build NRO
        working-directory: source/opticraft_v141_work
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean || true
          make -j2 V=1
          test -s OptiCraft-v147.nro
          ls -lh OptiCraft-v147.nro
          test "$(wc -c < OptiCraft-v147.nro)" -gt 1000

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiCraft-v147-NRO-diagnostic
          path: source/opticraft_v141_work/OptiCraft-v147.nro
          if-no-files-found: error
          retention-days: 14
