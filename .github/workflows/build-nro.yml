name: Build OptiCraft first NRO

on:
  workflow_dispatch:
  push:
    paths:
      - "OptiCraft_Original_Java125_Switch_Engineering_v91.zip"
      - ".github/workflows/build-nro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro toolchain
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          test -x "$DEVKITPRO/tools/bin/nacptool"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version

      - name: Ensure libnx library is installed
        run: |
          if [ ! -f "$DEVKITPRO/libnx/lib/libnx.a" ]; then
            dkp-pacman -Sy --noconfirm libnx
          fi
          test -f "$DEVKITPRO/libnx/lib/libnx.a"
          test -f "$DEVKITPRO/libnx/switch.specs"
          echo "libnx archive candidates:"
          find "$DEVKITPRO/libnx" -maxdepth 3 -type f \( -name 'libnx.a' -o -name 'libnx*.a' \) -print
          test -s "$DEVKITPRO/libnx/lib/libnx.a"

      - name: Extract v91 source archive
        run: |
          test -f OptiCraft_Original_Java125_Switch_Engineering_v91.zip
          mkdir source
          unzip -q OptiCraft_Original_Java125_Switch_Engineering_v91.zip -d source
          test -f source/OptiCraft_Switch_Engineering_v63/Makefile

      - name: Build NRO with canonical libnx template
        working-directory: source/OptiCraft_Switch_Engineering_v63
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          mkdir -p boot
          cat > boot/main.c <<'EOF'
          #include <stdio.h>
          #include <switch.h>

          int main(int argc, char* argv[]) {
              (void)argc;
              (void)argv;

              consoleInit(NULL);
              padConfigureInput(1, HidNpadStyleSet_NpadStandard);
              PadState pad;
              padInitializeDefault(&pad);

              printf("OPTICRAFT - FIRST SWITCH BOOT\\n");
              printf("Minecraft Java 1.2.5 / OptiFine\\n\\n");
              printf("NRO entry point: RUNNING\\n");
              printf("libnx main loop: RUNNING\\n");
              printf("Java VM: NOT CONNECTED\\n");
              printf("Minecraft JAR: NOT LOADED\\n\\n");
              printf("Press A to test input.\\n");
              printf("Press + to return to hbmenu.\\n");

              unsigned frames = 0;
              bool input_seen = false;
              while (appletMainLoop()) {
                  padUpdate(&pad);
                  u64 down = padGetButtonsDown(&pad);
                  if (down & HidNpadButton_Plus) break;
                  if (down & HidNpadButton_A) input_seen = true;

                  consoleClear();
                  printf("OPTICRAFT - FIRST SWITCH BOOT\\n\\n");
                  printf("NRO entry point: RUNNING\\n");
                  printf("Frames: %u\\n", ++frames);
                  printf("A button: %s\\n", input_seen ? "DETECTED" : "WAITING");
                  printf("Java VM: NOT CONNECTED\\n");
                  printf("Minecraft: NOT STARTED\\n\\n");
                  printf("Press + to exit.\\n");
                  consoleUpdate(NULL);
              }

              consoleExit(NULL);
              return 0;
          }
          EOF
          cat > Makefile <<'EOF'
          .SUFFIXES:
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO")
          endif
          TOPDIR ?= $(CURDIR)
          include $(DEVKITPRO)/libnx/switch_rules

          TARGET := OptiCraft
          BUILD := build
          SOURCES := boot
          DATA :=
          INCLUDES :=
          ICON := assets/opticraft_icon.jpg
          APP_TITLE := OptiCraft - Java 1.2.5
          APP_AUTHOR := OptiCraft Switch Port
          APP_VERSION := 0.0.2
          ARCH := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS := -g -Wall -O2 -ffunction-sections -fdata-sections $(ARCH) -D__SWITCH__
          CXXFLAGS := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS := -g $(ARCH)
          LDFLAGS = -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map)
          LIBS := -lnx
          LIBDIRS := $(PORTLIBS) $(LIBNX)
          EOF
          make clean
          make V=1
          test -s OptiCraft.nro
          file OptiCraft.nro
          "$DEVKITPRO/tools/bin/elf2nro" --help >/dev/null

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: OptiCraft-first-NRO
          path: |
            source/OptiCraft_Switch_Engineering_v63/OptiCraft.nro
            source/OptiCraft_Switch_Engineering_v63/assets/opticraft_icon.jpg
          if-no-files-found: error
          retention-days: 14
