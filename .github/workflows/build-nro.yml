name: Build OptiCraft first NRO

on:
  workflow_dispatch:
  push:
    paths:
      - "OptiCraft_Original_Java125_Switch_Engineering_v91.zip"
      - ".github/workflows/build-nro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro toolchain
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          test -x "$DEVKITPRO/tools/bin/nacptool"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version

      - name: Ensure libnx library is installed
        run: |
          if [ ! -f "$DEVKITPRO/libnx/lib/libnx.a" ]; then
            dkp-pacman -Sy --noconfirm libnx
          fi
          test -f "$DEVKITPRO/libnx/lib/libnx.a"
          test -f "$DEVKITPRO/libnx/switch.specs"
          echo "libnx archive candidates:"
          find "$DEVKITPRO/libnx" -maxdepth 3 -type f \( -name 'libnx.a' -o -name 'libnx*.a' \) -print
          test -s "$DEVKITPRO/libnx/lib/libnx.a"

      - name: Extract v91 source archive
        run: |
          test -f OptiCraft_Original_Java125_Switch_Engineering_v91.zip
          mkdir source
          unzip -q OptiCraft_Original_Java125_Switch_Engineering_v91.zip -d source
          test -f source/OptiCraft_Switch_Engineering_v63/Makefile

      - name: Build NRO
        working-directory: source/OptiCraft_Switch_Engineering_v63
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          # The archived Makefile only declared variables and never generated object files.
          # Replace it with an explicit, minimal devkitPro build for the diagnostic entry point.
          cat > Makefile <<'EOF'
          .DEFAULT_GOAL := all
          TARGET := OptiCraft
          APP_TITLE := OptiCraft - Java 1.2.5
          APP_AUTHOR := OptiCraft Switch Port
          APP_VERSION := 0.0.1
          APP_ICON := assets/opticraft_icon.jpg
          ARCH := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS := -g -Wall -Wextra -O2 -ffunction-sections -fdata-sections $(ARCH) -D__SWITCH__
          CXXFLAGS := $(CFLAGS) -std=gnu++17
          LDFLAGS := -specs=$(DEVKITPRO)/libnx/switch.specs -Wl,--gc-sections -pie
          LIBS := -L$(DEVKITPRO)/libnx/lib -lnx
          NROFLAGS := --icon=$(APP_ICON) --nacp=$(TARGET).nacp
          include $(DEVKITPRO)/libnx/switch_rules

          .PHONY: all clean
          all: $(TARGET).nacp $(TARGET).nro

          build/main.o: switch_nro/main.cpp
          	mkdir -p build
          	$(CXX) $(CXXFLAGS) -Iinclude -c $< -o $@

          $(TARGET).elf: build/main.o
          	$(CXX) $(LDFLAGS) $^ $(LIBS) -o $@

          clean:
          	rm -rf build $(TARGET).elf $(TARGET).nro $(TARGET).nacp $(TARGET).lst
          EOF
          make clean
          make V=1 all
          test -s OptiCraft.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: OptiCraft-first-NRO
          path: |
            source/OptiCraft_Switch_Engineering_v63/OptiCraft.nro
            source/OptiCraft_Switch_Engineering_v63/assets/opticraft_icon.jpg
          if-no-files-found: error
          retention-days: 14
