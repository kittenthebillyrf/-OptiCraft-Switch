name: Build OptiCraft playable Switch prototype
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "runtime/input-jni-v124", "runtime/lwjgl-abi-v125", "runtime/world-save-v126", "runtime/world-catalog-v127", "runtime/world-preview-v128", "runtime/world-chunks-v129", "runtime/world-neighborhood-v130", "runtime/world-stream-v131", "runtime/chunk-metadata-v132", "runtime/terrain-textures-v133", "runtime/side-textures-v134", "runtime/terrain-elevation-v135"]
  push:
    branches: ["main", "prototype/first-playable-world", "runtime/platform-abi-v123", "runtime/input-jni-v124", "runtime/lwjgl-abi-v125", "runtime/world-save-v126", "runtime/world-catalog-v127", "runtime/world-preview-v128", "runtime/world-chunks-v129", "runtime/world-neighborhood-v130", "runtime/world-stream-v131", "runtime/chunk-metadata-v132", "runtime/terrain-textures-v133", "runtime/side-textures-v134", "runtime/terrain-elevation-v135"]
    paths:
      - "prototype/**"
      - "runtime/platform/**"
      - "runtime/input/**"
      - "runtime/world/**"
      - ".github/workflows/build-playable-prototype.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Restore Java world reader sources
        run: tar -xzf runtime/world/world_reader_v126.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Verify toolchain
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -f "$DEVKITPRO/libnx/switch.specs"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          test -x "$DEVKITPRO/tools/bin/nacptool"
      - name: Run Java save catalog host tests
        run: sh runtime/world/tests/run_world_catalog_test.sh
      - name: Run host platform ABI tests
        run: sh runtime/platform/tests/run_host_test.sh
      - name: Run platform input bridge tests
        run: sh runtime/input/tests/run_host_test.sh
      - name: Build native NRO
        working-directory: prototype
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean || true
          make V=1
          test -s OptiCraft.nro
      - uses: actions/upload-artifact@v4
        with:
          name: OptiCraft-World-Prototype-0.1
          path: prototype/OptiCraft.nro
          if-no-files-found: error
          retention-days: 30

  jni-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib development headers for host parser test
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev
      - name: Run selected world preview host tests
        run: sh runtime/world/tests/run_world_preview_test.sh
      - name: Run legacy Anvil chunk host tests
        run: sh runtime/world/tests/run_world_anvil_chunk_test.sh
      - name: Run ZIP/PNG terrain texture loader tests
        run: sh runtime/world/tests/run_world_texture_loader_test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build JNI input bridge and run Java smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/build/jni-smoke"
          c++ -std=c++17 -Wall -Wextra -fPIC -shared -pthread \
            -I"$ROOT/runtime/platform/include" -I"$ROOT/runtime/input/include" \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$ROOT/runtime/platform/host/opticraft_platform_host.cpp" \
            "$ROOT/runtime/input/src/input_adapter.cpp" \
            "$ROOT/runtime/input/src/switch_input_bridge.cpp" \
            "$ROOT/runtime/input/src/lwjgl_event_buffers.cpp" \
            "$ROOT/runtime/input/src/opticraft_input_api.cpp" \
            "$ROOT/runtime/input/src/switch_input_bridge_jni.cpp" \
            -o "$ROOT/build/jni-smoke/libopticraftinput.so"
          javac -d "$ROOT/build/jni-smoke" \
            "$ROOT/runtime/input/java/org/lwjgl/switchport/SwitchInputBridge.java" \
            "$ROOT/runtime/input/tests/java/org/lwjgl/switchport/SwitchInputBridgeSmokeTest.java"
          java -cp "$ROOT/build/jni-smoke" org.lwjgl.switchport.SwitchInputBridgeSmokeTest \
            "$ROOT/build/jni-smoke/libopticraftinput.so"
